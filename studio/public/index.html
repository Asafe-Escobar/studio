<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero1 Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFEEEB;--panel:#FFFFFF;--ink:#1B1815;--muted:#6E6963;--line:#E4E1DC;--soft:#F5F3F0;
  --accent:#FF6A13;--accent-ink:#FFFFFF;--accent-soft:#FFEBDD;--ok:#23955A;--err:#D23A2A;
  --board:#2A2724;--board-dot:#3A3632;--radius:18px;
  --head:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
}
:root[data-theme="dark"]{--bg:#141210;--panel:#1E1B18;--ink:#F3EFEA;--muted:#A39D96;--line:#302C28;--soft:#26221F;--accent-soft:#3A2416;--board:#0E0D0C;--board-dot:#24211E}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 Inter,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}

/* barra lateral */
aside{background:var(--panel);border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.marca{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;text-decoration:none}
.marca .selo{width:40px;height:40px;border-radius:11px;background:var(--ink);display:grid;place-items:center;position:relative}
.marca .selo b{font:800 17px/1 var(--head);color:var(--panel);letter-spacing:-.04em}
.marca .selo i{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.marca span{font:700 23px/1 var(--head);letter-spacing:-.04em}
.criar{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:14px;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;margin-bottom:14px}
.criar:hover{filter:brightness(1.05)}
nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;text-decoration:none;font-weight:500;color:var(--ink)}
nav a svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
nav a:hover{background:var(--soft)}
nav a.on{background:var(--soft)}
nav a .badge{margin-left:auto;font-size:11px;font-weight:600;background:var(--accent);color:#fff;border-radius:99px;padding:1px 7px}
.rodape{margin-top:auto;border-top:1px solid var(--line);padding:16px 8px 0;display:grid;gap:10px}
.rodape .time{display:flex;align-items:center;gap:10px;text-decoration:none}
.avatares{display:flex}
.avatares span{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);margin-left:-7px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.avatares span:first-child{margin-left:0}
.rodape small{color:var(--muted);font-size:12px}

/* conteúdo */
main{padding:44px 56px 80px;max-width:1320px;width:100%;min-width:0}
h1{font:800 44px/1.05 var(--head);letter-spacing:-.035em;margin:0 0 8px}
h2{font:700 24px/1.2 var(--head);letter-spacing:-.025em;margin:46px 0 16px}
.lead{color:var(--muted);font-size:16px;max-width:720px;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--muted);font-weight:500;text-decoration:none}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.vazio{color:var(--muted);text-align:center;padding:44px}
.voltar{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;margin-bottom:18px;font-weight:500;text-decoration:none;display:inline-block}
.voltar:hover{color:var(--ink)}

/* cards de criação */
.opcoes{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px}
.opcao{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:26px 28px 30px;text-decoration:none;display:flex;flex-direction:column;min-height:236px;transition:border-color .15s,transform .15s}
.opcao:hover{border-color:var(--ink);transform:translateY(-2px)}
.ico{width:64px;height:80px;border:1.6px solid var(--ink);border-radius:10px;display:grid;place-items:center}
.ico svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.opcao h3{font:700 30px/1.1 var(--head);letter-spacing:-.035em;margin:auto 0 6px;padding-top:34px}
.opcao p{margin:0;color:var(--muted);font-size:15px;font-weight:500}
.opcao.nova .ico{border-color:var(--accent)} .opcao.nova .ico svg{stroke:var(--accent)}

/* quadro de estilos */
.quadro{background:var(--board);border-radius:22px;padding:30px;background-image:radial-gradient(var(--board-dot) 1.2px,transparent 1.2px);background-size:22px 22px;overflow-x:auto}
.estilos{display:flex;gap:16px;min-width:max-content}
.estilo{width:116px;text-align:center;color:#E9E4DE;font-size:12.5px;font-weight:500}
.estilo .tela{width:116px;height:206px;border-radius:14px;background:#1A1816;display:grid;place-items:center;margin-bottom:10px;border:1px solid #3A3632}
.estilo .tela .mock{width:84px;height:150px}

/* em produção */
.jobs{display:grid;gap:10px}
.job{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 18px}
.job .pulso{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.job.rodando .pulso{background:var(--accent);animation:pulso 1.4s infinite}
.job.concluido .pulso{background:var(--ok)} .job.erro .pulso{background:var(--err)}
@keyframes pulso{50%{opacity:.35}}
.job b{display:block;font-weight:600}
.job small{color:var(--muted);font-size:12.5px}
.job .acoes{display:flex;gap:8px;align-items:center}
.btn-sec{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:13px;text-decoration:none;white-space:nowrap}
.btn-sec:hover{border-color:var(--ink)}
.log{grid-column:1/-1;white-space:pre-wrap;font:12px/1.5 ui-monospace,Consolas,monospace;background:var(--soft);border-radius:10px;padding:12px;max-height:300px;overflow:auto;margin:0}

/* grade de entregas */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.item{text-decoration:none;display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
.item:hover{border-color:var(--ink)}
.item h4{margin:4px 0 0;font:700 19px/1.2 var(--head);letter-spacing:-.02em}
.item p{margin:0;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item .thumb{aspect-ratio:16/10;border-radius:12px;background:var(--soft);overflow:hidden;display:flex;align-items:center;justify-content:center;gap:6px}
.item .thumb video{width:100%;height:100%;object-fit:cover}
.item .thumb .mock{width:40px;height:72px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}

/* formulários */
.criacao{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;margin-top:28px;align-items:start}
.form{display:grid;gap:22px;padding:28px}
.campo{display:grid;gap:8px}
.campo>label,.rotulo{font-weight:600;font-size:14px}
.campo small{color:var(--muted);font-size:12.5px}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:13px 15px;outline:none;font-size:15px}
.inp:focus{border-color:var(--accent);background:var(--panel)}
textarea.inp{resize:vertical;min-height:84px}
select.inp{height:50px;padding:0 14px}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;gap:8px}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip .mock{width:14px;height:25px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:5px;gap:5px}
.seg button{border:0;background:transparent;border-radius:10px;padding:13px 12px;cursor:pointer;font-weight:600;text-align:left}
.seg button small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px}
.seg button.on{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.enq{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.enq button{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;cursor:pointer;text-align:left;display:grid;gap:10px}
.enq button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.enq b{font-size:13.5px} .enq small{color:var(--muted);font-size:12px;display:block}
.enq svg{width:34px;height:60px}
.drop{border:1.6px dashed var(--line);border-radius:14px;padding:22px;text-align:center;cursor:pointer;color:var(--muted);background:var(--bg)}
.drop:hover,.drop.sobre{border-color:var(--accent);color:var(--ink)}
.drop b{color:var(--ink)}
.barra-up{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.barra-up i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.arquivo-ok{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-weight:500}
.ou{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px}
.ou::before,.ou::after{content:"";flex:1;height:1px;background:var(--line)}
.trechos{display:grid;gap:8px}
.trecho{display:grid;grid-template-columns:28px 120px 120px 1fr 36px;gap:8px;align-items:center}
.trecho .n{color:var(--muted);font-weight:600;text-align:center}
.trecho .inp{padding:10px 12px;font-size:14px}
.x{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:20px;border-radius:8px;height:38px}
.x:hover{background:var(--soft);color:var(--err)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.switch input{appearance:none;width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--accent)} .switch input:checked::after{left:21px}
.enviar{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:15px 22px;font-weight:600;font-size:15.5px;cursor:pointer}
.enviar:disabled{opacity:.5;cursor:default}
.erro-msg{color:var(--err);font-weight:500}
.lado{display:grid;gap:14px;position:sticky;top:24px}
.lado h4{margin:0 0 10px;font:700 17px var(--head);letter-spacing:-.02em}
.passos{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.passos li{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:13.5px}
.passos li span{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.passos li b{display:block;font-weight:600}
.passos li small{color:var(--muted)}

/* detalhe */
.formatos{display:grid;gap:14px}
.fmt{display:grid;grid-template-columns:56px 1fr;gap:16px;align-items:center}
.barra{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:6px 0}
.barra i{display:block;height:100%;background:var(--accent);border-radius:99px}
.fmt small{color:var(--muted)}
.mock{width:54px;height:96px;flex:none}
.roteiros{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.rot-top{display:flex;gap:14px}
.rot h4{margin:0 0 4px;font:700 18px/1.2 var(--head);letter-spacing:-.02em}
.gancho{font-size:14px;margin:12px 0;padding:11px 13px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;font-weight:500}
.alerta{font-size:12.5px;margin:6px 0;padding:8px 11px;border-radius:10px;background:#FFF4D6;color:#7A5300}
[data-theme="dark"] .alerta{background:#3A2F12;color:#F2D58A}
.cenas{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.cenas td{border-top:1px solid var(--line);padding:8px 6px;vertical-align:top}
.cenas td:first-child{color:var(--muted);white-space:nowrap;width:58px}
.cenas .vis{color:var(--muted);font-size:12.5px}
.cenas .tt{display:inline-block;margin-top:4px;font-size:11.5px;font-weight:600;background:var(--soft);padding:2px 7px;border-radius:5px}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:10px}
.posts{width:100%;border-collapse:collapse;font-size:13.5px}
.posts th{text-align:left;color:var(--muted);font-weight:500;font-size:12.5px;padding:8px}
.posts td{border-top:1px solid var(--line);padding:9px 8px;vertical-align:top}
.posts a{color:var(--accent);text-decoration:none}
.num{text-align:right;font-variant-numeric:tabular-nums}
.cortes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.corte video{width:100%;aspect-ratio:9/16;background:#000;border-radius:12px;object-fit:contain}
.corte .sem{aspect-ratio:9/16;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--muted);font-size:13px}
.corte h4{margin:10px 0 4px;font:700 16px/1.25 var(--head);letter-spacing:-.015em}
.nota{font-weight:700;color:var(--accent)}
.padroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.padroes .card p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.faixa{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--ink);color:var(--panel);border-radius:var(--radius);padding:22px 26px;margin-top:26px}
.faixa b{font:700 20px var(--head);letter-spacing:-.02em;display:block}
.faixa small{opacity:.7}
.faixa a{background:var(--accent);color:#fff;text-decoration:none;border-radius:12px;padding:12px 18px;font-weight:600;white-space:nowrap}
.cab{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.agentes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.agente-card{display:grid;gap:10px}
.agente-card .topo{display:flex;align-items:center;gap:12px}
.agente-card .av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font:700 15px var(--head)}
.agente-card b{font:700 17px var(--head);letter-spacing:-.02em}
.agente-card p{margin:0;color:var(--muted);font-size:13.5px}
.mobile-top{display:none}
.acoes-rot{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.btn-pri{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13px}
.btn-pri:hover{filter:brightness(1.06)} .btn-pri:disabled,.btn-sec:disabled{opacity:.6;cursor:default}
.menu{position:relative} .menu summary{list-style:none;margin:0;color:var(--ink)} .menu summary::-webkit-details-marker{display:none}
.menu>div{position:absolute;right:0;bottom:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;display:grid;min-width:170px;z-index:5}
.menu>div a,.menu>div button{background:none;border:0;text-align:left;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;text-decoration:none;color:var(--ink)}
.menu>div a:hover,.menu>div button:hover{background:var(--soft)}
.av-g{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font:700 16px var(--head);flex:none}
.av-g.grande{width:64px;height:64px;border-radius:18px;font-size:22px}
.add-prof{border:1.6px dashed var(--line);background:transparent;cursor:pointer;align-items:center;justify-content:center;text-align:center;min-height:170px;font:inherit;color:var(--ink)}
.add-prof:hover{border-color:var(--accent)}
.prof-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;margin-top:22px;align-items:start}
.chat{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:520px;padding:0;overflow:hidden}
.chat-msgs{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.chat-vazio{margin:auto;text-align:center;max-width:420px;color:var(--muted)} .chat-vazio b{color:var(--ink);font:700 19px var(--head)}
.msg{display:flex;flex-direction:column;max-width:86%} .msg.eu{align-self:flex-end;align-items:flex-end} .msg.ia{align-self:flex-start}
.msg .b{padding:12px 15px;border-radius:16px;font-size:14px;line-height:1.55}
.msg.eu .b{background:var(--ink);color:var(--panel);border-bottom-right-radius:5px}
.msg.ia .b{background:var(--soft);border-bottom-left-radius:5px}
.msg .b h4{margin:10px 0 4px;font:700 15px var(--head)} .msg .b h5{margin:8px 0 2px;font-size:13.5px}
.msg .b code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:5px;font-size:12.5px}
.copiar-msg{align-self:flex-start;background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer;padding:4px 2px}
.copiar-msg:hover{color:var(--accent)}
.nota-mem{margin-top:8px;font-size:12px;color:var(--accent);font-weight:600}
.digitando{display:inline-flex;gap:4px} .digitando i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:pulso 1s infinite}
.digitando i:nth-child(2){animation-delay:.15s} .digitando i:nth-child(3){animation-delay:.3s}
.chat-sug{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none} .chat-sug .chip{white-space:nowrap;font-size:12.5px;padding:6px 11px}
.chat-in{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--line);align-items:flex-end}
.chat-in textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;font-size:14.5px;outline:none;max-height:200px}
.chat-in textarea:focus{border-color:var(--accent);background:var(--panel)}
.chat-in .enviar{padding:12px 18px}
.mini-vids{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mini-vids a{position:relative;aspect-ratio:9/16;border-radius:8px;overflow:hidden;background:var(--soft);display:grid;place-items:center;font-size:10px;color:var(--muted);text-decoration:none}
.mini-vids img{width:100%;height:100%;object-fit:cover}
.mini-vids i{position:absolute;bottom:4px;left:4px;background:var(--accent);color:#fff;font-style:normal;font-weight:700;font-size:10px;border-radius:99px;padding:1px 6px}
.md-tab{border-collapse:collapse;margin:8px 0;font-size:13px;width:100%}.md-tab th,.md-tab td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}.md-tab th{background:var(--panel)}
.memoria{font-size:12.5px;line-height:1.5;margin-top:8px;max-height:320px;overflow:auto}
.memoria h4{margin:10px 0 2px;font-size:13px}
.looks{display:flex;gap:8px;margin:10px 0}.looks figure{margin:0;width:64px;text-align:center}.looks img{width:64px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}.looks figcaption{font-size:11px;color:var(--muted);line-height:1.2;margin-top:3px}
.vid-clone{margin:0 0 12px;font-size:13px}.vid-clone video{width:100%;max-height:420px;border-radius:12px;background:#000;display:block;margin-bottom:6px}.vid-proc{aspect-ratio:9/16;max-height:200px;border-radius:12px;background:var(--bg);display:grid;place-items:center;color:var(--muted);margin-bottom:6px}
@media (max-width:1100px){.prof-grid{grid-template-columns:minmax(0,1fr)}.chat{height:70vh}}
.videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.video-card{padding:0;overflow:hidden;display:flex;flex-direction:column}
.vmidia{position:relative;aspect-ratio:9/16;background:#000}
.vmidia video,.vmidia img,.vmidia iframe{width:100%;height:100%;object-fit:cover;border:0;display:block}
.vmidia .sem{height:100%;display:grid;place-items:center;color:#999;font-size:12px}
.selo-alta{position:absolute;top:10px;left:10px;background:var(--accent);color:#fff;font-weight:700;font-size:12px;border-radius:99px;padding:4px 10px;pointer-events:none}
.vinfo{padding:12px 14px 14px;font-size:13px}
.vinfo a{text-decoration:none;color:var(--ink)}
.vgancho{margin:8px 0 0;color:var(--muted);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mercado-tag{margin-top:10px;font-size:12.5px;background:var(--accent-soft);border-radius:10px;padding:8px 11px;line-height:1.45}
.mercado-tag a{color:var(--accent);text-decoration:none;font-weight:600}
.legenda-ig{margin-top:12px;background:var(--soft);border-radius:12px;padding:12px 13px}
.legenda-ig .cab-leg{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;margin-bottom:6px}
.legenda-ig p{margin:0;white-space:pre-wrap;font-size:13px;line-height:1.5}
.legenda-ig .hs{color:var(--accent);font-size:12.5px;margin-top:8px}
.vol{display:flex;align-items:center;gap:10px;font-size:13px}.vol input{flex:1}
.musica-campo audio{width:100%;height:36px}
.falas-heygen{margin-top:12px;background:var(--soft);border-radius:12px;padding:12px 13px}
.falas-heygen .cab-leg{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;margin-bottom:6px}
.falas-heygen .cab-leg small{color:var(--muted)}
.falas-heygen p{margin:0 0 10px;white-space:pre-wrap;font-size:13px;line-height:1.5;max-height:180px;overflow:auto}
.slides{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.slide{flex:none;width:300px;display:grid;gap:8px;justify-items:start}
.slide img{width:300px;aspect-ratio:4/5;border-radius:12px;display:block;border:1px solid var(--line)}
.slide .sem{width:300px;aspect-ratio:4/5;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--muted)}

@media (max-width:1100px){.opcoes{grid-template-columns:repeat(2,1fr)}.criacao{grid-template-columns:minmax(0,1fr)}.lado{position:static}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .opcoes{grid-template-columns:minmax(0,1fr)}
  .ico{width:52px;height:64px;flex:none}
  aside{min-width:0;position:static;height:auto;padding:14px 16px;flex-direction:row;flex-wrap:wrap;align-items:center}
  .marca{padding:0 8px 0 0}.criar{margin:0 0 0 auto;padding:10px 14px}
  nav{flex:1 1 100%;min-width:0;display:flex;overflow-x:auto;gap:4px;scrollbar-width:none}nav a{white-space:nowrap;padding:9px 12px}
  .rodape{display:none}
  main{padding:26px 16px 60px}
  h1{font-size:32px}
  .opcao{min-height:190px}.opcao h3{font-size:26px}
  .duas,.enq{grid-template-columns:1fr}
  .trecho{grid-template-columns:22px 1fr 1fr 36px}.trecho .t{grid-column:2/4}
  .roteiros{grid-template-columns:1fr}
  .faixa{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <a class="marca" href="#/"><div class="selo"><b>z1</b><i></i></div><span>studio</span></a>
    <a class="criar" href="#/"><svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Criar</a>
    <nav id="nav"></nav>
    <div class="rodape">
      <a class="time" href="#/time"><div class="avatares" id="avs"></div><small id="time-txt">Time</small></a>
    </div>
  </aside>
  <main id="main"></main>
</div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const n = (v) => v == null ? "—" : Intl.NumberFormat("pt-BR", { notation: "compact", maximumFractionDigits: 1 }).format(v);
const pct = (v) => v == null ? "—" : (v * 100).toFixed(1).replace(".", ",") + "%";
const data = (s) => s ? new Date(s).toLocaleDateString("pt-BR", { day: "2-digit", month: "short" }) : "";
async function api(u, o) { const r = await fetch(u, o); const j = r.headers.get("content-type")?.includes("json") ? await r.json() : await r.text(); if (!r.ok) throw new Error(j.erro || "Erro"); return j; }
const post = (u, b) => api(u, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) });

const NOMES = {
  "talking-head":"Talking head","tela-dividida":"Tela dividida","react":"React","green-screen":"Green screen",
  "b-roll-narrado":"B-roll narrado","pov-texto":"POV com texto","tutorial-tela":"Tutorial de tela","carrossel":"Carrossel",
  "entrevista-podcast":"Corte de podcast","antes-depois":"Antes e depois","lista-top":"Lista / Top","trend-audio":"Trend de áudio",
  "vlog-bastidores":"Vlog / bastidores","dueto-costura":"Dueto / costura"
};
const COR = { pesquisador:"#5AC8FA", estrategista:"#AF52DE", roteirista:"#FF3B30", copywriter:"#007AFF", designer:"#FF9500",
  "editor-video":"#FF2D55", "gestor-trafego":"#34C759", "social-media":"#5856D6", "produtor-avatar":"#FFCC00" };
const ROTULO = { pesquisador:"Pesquisador", estrategista:"Estrategista", roteirista:"Roteirista", copywriter:"Copywriter", designer:"Designer",
  "editor-video":"Editor de vídeo", "gestor-trafego":"Gestor de tráfego", "social-media":"Social media", "produtor-avatar":"Produtor avatar" };

// Mini mockup 9:16 de cada formato
function mock(f) {
  const A = "var(--accent)", S = "var(--soft)", M = "var(--muted)", L = "var(--line)";
  const head = (x, y, r = 7, c = M) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/><path d="M${x - r * 1.7} ${y + r * 3.2} q${r * 1.7} -${r * 2.6} ${r * 3.4} 0" fill="${c}"/>`;
  const txt = (y, w = 30, x = 12) => `<rect x="${x}" y="${y}" width="${w}" height="4" rx="2" fill="${A}"/>`;
  const shapes = {
    "talking-head": head(27, 40, 9) + txt(76),
    "tela-dividida": `<rect x="0" y="48" width="54" height="48" fill="${S}"/><line x1="0" y1="48" x2="54" y2="48" stroke="${A}" stroke-width="1.5"/>` + head(27, 18, 7) + `<rect x="10" y="58" width="34" height="18" rx="2" fill="${L}"/><path d="M14 72 l7 -6 6 4 8 -8 5 5" stroke="${A}" fill="none" stroke-width="1.5"/>`,
    "react": `<rect x="4" y="8" width="46" height="60" rx="3" fill="${L}"/><path d="M22 30 l12 8 -12 8z" fill="${M}"/><circle cx="40" cy="78" r="11" fill="${S}" stroke="${A}" stroke-width="1.5"/>` + head(40, 74, 4),
    "green-screen": `<rect x="4" y="8" width="46" height="52" rx="3" fill="${L}"/><rect x="9" y="14" width="30" height="4" rx="2" fill="${M}"/><rect x="9" y="22" width="22" height="3" rx="1.5" fill="${M}"/>` + head(18, 66, 7, A),
    "b-roll-narrado": `<rect x="4" y="8" width="21" height="28" rx="2" fill="${L}"/><rect x="29" y="8" width="21" height="28" rx="2" fill="${L}"/><rect x="4" y="40" width="46" height="26" rx="2" fill="${L}"/><path d="M8 80 v-4 M12 82 v-8 M16 80 v-4 M20 84 v-12 M24 80 v-4 M28 82 v-8 M32 80 v-4 M36 83 v-10 M40 80 v-4 M44 82 v-8" stroke="${A}" stroke-width="2" stroke-linecap="round"/>`,
    "pov-texto": `<rect x="6" y="14" width="42" height="6" rx="3" fill="${A}"/><rect x="10" y="24" width="34" height="6" rx="3" fill="${A}"/>` + head(27, 56, 7),
    "tutorial-tela": `<rect x="5" y="18" width="44" height="44" rx="3" fill="${L}"/><rect x="9" y="22" width="36" height="5" rx="1" fill="${M}"/><rect x="9" y="31" width="20" height="8" rx="2" fill="${A}"/><path d="M30 42 l0 12 3 -3 3 6 2 -1 -3 -6 4 0z" fill="${M}"/>`,
    "carrossel": `<rect x="14" y="16" width="34" height="50" rx="3" fill="${L}"/><rect x="9" y="20" width="34" height="50" rx="3" fill="${S}" stroke="${L}"/><rect x="14" y="30" width="22" height="5" rx="2" fill="${A}"/><circle cx="21" cy="82" r="2" fill="${A}"/><circle cx="27" cy="82" r="2" fill="${M}"/><circle cx="33" cy="82" r="2" fill="${M}"/>`,
    "entrevista-podcast": head(16, 38, 6) + head(38, 38, 6) + `<rect x="10" y="22" width="2" height="12" fill="${M}"/><rect x="6" y="70" width="42" height="7" rx="2" fill="${A}"/>`,
    "antes-depois": `<rect x="0" y="0" width="27" height="96" fill="${L}"/><line x1="27" y1="0" x2="27" y2="96" stroke="${A}" stroke-width="1.5"/>` + head(13.5, 40, 5) + head(40.5, 40, 6, A) + `<text x="13.5" y="16" font-size="7" text-anchor="middle" fill="${M}" font-family="Inter">A</text><text x="40.5" y="16" font-size="7" text-anchor="middle" fill="${A}" font-family="Inter">B</text>`,
    "lista-top": [0, 1, 2].map((i) => `<text x="8" y="${30 + i * 18}" font-size="9" font-weight="700" fill="${A}" font-family="Inter">${i + 1}</text><rect x="17" y="${23 + i * 18}" width="${28 - i * 4}" height="5" rx="2" fill="${M}"/>`).join(""),
    "trend-audio": head(27, 38, 7) + `<path d="M36 70 v-14 l10 -3 v14" stroke="${A}" stroke-width="2" fill="none"/><circle cx="34" cy="70" r="3" fill="${A}"/><circle cx="44" cy="67" r="3" fill="${A}"/>`,
    "vlog-bastidores": [0, 1, 2].map((i) => `<rect x="8" y="${10 + i * 26}" width="38" height="22" rx="2" fill="${L}"/>`).join("") + `<circle cx="27" cy="47" r="5" fill="${A}"/>`,
    "dueto-costura": `<rect x="0" y="0" width="27" height="96" fill="${L}"/><line x1="27" y1="0" x2="27" y2="96" stroke="${A}" stroke-width="1.5"/>` + head(13.5, 42, 6) + head(40.5, 42, 6, A),
  };
  return `<svg class="mock" viewBox="0 0 54 96"><rect x="0.5" y="0.5" width="53" height="95" rx="7" fill="var(--panel)" stroke="var(--line)"/><clipPath id="c"><rect width="54" height="96" rx="7"/></clipPath><g clip-path="url(#c)">${shapes[f] || head(27, 40)}</g></svg>`;
}

// Ícones de linha
const I = {
  inicio: `<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>`,
  busca: `<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>`,
  roteiro: `<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>`,
  tesoura: `<circle cx="6" cy="7" r="2.6"/><circle cx="6" cy="17" r="2.6"/><path d="M8.2 8.4L20 17M8.2 15.6L20 7"/>`,
  video: `<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10.5l5-3v9l-5-3z"/>`,
  editar: `<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10 9.5l4.5 2.5-4.5 2.5z"/>`,
  estrategia: `<path d="M4 19l5-6 4 3 7-9"/><path d="M15 7h5v5"/>`,
  campanha: `<path d="M4 10v4a1 1 0 0 0 1 1h3l6 4V5L8 9H5a1 1 0 0 0-1 1z"/><path d="M18 9a4 4 0 0 1 0 6"/>`,
  carrossel: `<rect x="7" y="4" width="10" height="16" rx="1.5"/><path d="M4 7v10M20 7v10"/>`,
  time: `<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.2A4.5 4.5 0 0 1 21 18.5"/>`,
};
const ico = (k) => `<svg viewBox="0 0 24 24">${I[k]}</svg>`;

const MENU = [
  ["", "Início", "inicio"], ["perfis", "Perfis e professores", "time"], ["lista/pesquisas", "Pesquisas", "busca"], ["roteiros", "Roteiros", "roteiro"],
  ["lista/cortes", "Cortes", "tesoura"], ["lista/videos", "Vídeos", "video"], ["lista/campanhas", "Estratégias", "estrategia"], ["lista/carrosseis", "Carrosséis", "carrossel"], ["time", "Time", "time"],
];

const CRIAR = {
  pesquisa: { titulo: "Pesquisa de mercado", sub: "O que está performando no nicho, com roteiros prontos", ico: "busca",
    time: [["pesquisador", "Coleta posts, perfis e hashtags no Instagram e TikTok"], ["roteirista", "Escreve roteiros nos formatos que mais performam"]] },
  estrategia: { titulo: "Estratégia e roteiros", sub: "Plano de conteúdo, estilos de vídeo e roteiros", ico: "estrategia",
    time: [["estrategista", "Posicionamento, pilares e funil"], ["roteirista", "Roteiros cena a cena com formato definido"], ["copywriter", "Legendas e ganchos alternativos"], ["social-media", "Calendário de 4 semanas"]] },
  cortes: { titulo: "Cortes de podcast", sub: "Vários cortes 9:16 com legenda, automáticos ou na sua minutagem", ico: "tesoura", nova: true,
    time: [["editor-video", "Baixa, transcreve, escolhe e corta os melhores momentos"], ["roteirista", "Roteiriza vídeos derivados do episódio"]] },
  editar: { titulo: "Editar vídeo", sub: "Formato 9:16, legenda queimada e corte de trecho", ico: "editar",
    time: [["editor-video", "Transcreve, enquadra em 9:16 e queima a legenda"]] },
  campanha: { titulo: "Campanha completa", sub: "Estratégia, copy, criativos e plano de tráfego", ico: "campanha",
    time: [["estrategista", "Plano e funil"], ["copywriter", "Copy de anúncio"], ["designer", "Criativos"], ["gestor-trafego", "Estrutura de mídia paga"], ["social-media", "Calendário"]] },
};

let itensCache = [], jobsCache = [];

function navAtivo() {
  const h = location.hash.replace(/^#\/?/, "");
  const rodando = jobsCache.filter((j) => j.status === "rodando").length;
  $("#nav").innerHTML = MENU.map(([r, t, i]) => {
    const on = r === "" ? (h === "" || h.startsWith("criar")) : r === "perfis" ? /^(perfis|perfil|professor)/.test(h) : h.startsWith(r) || (r === "lista/cortes" && h.startsWith("item/cortes"));
    return `<a href="#/${r}" class="${on ? "on" : ""}">${ico(i)}${t}${r === "" && rodando ? `<span class="badge">${rodando}</span>` : ""}</a>`;
  }).join("");
}

async function carregarTime() {
  const ag = await api("/api/agentes");
  $("#avs").innerHTML = ag.slice(0, 6).map((a) => `<span style="background:${COR[a.nome] || "#888"}">${(ROTULO[a.nome] || a.nome)[0]}</span>`).join("");
  $("#time-txt").textContent = `${ag.length} agentes no time`;
  return ag;
}

// ---------- Início ----------
async function inicio() {
  const [itens, jobs] = await Promise.all([api("/api/itens"), api("/api/jobs")]);
  itensCache = itens; jobsCache = jobs; navAtivo();
  $("#main").innerHTML = `
    <h1>O que você quer criar?</h1>
    <div class="opcoes">${Object.entries(CRIAR).map(([k, c]) => `
      <a class="opcao ${c.nova ? "nova" : ""}" href="#/criar/${k}"><div class="ico">${ico(c.ico)}</div><h3>${c.titulo}</h3><p>${c.sub}</p></a>`).join("")}
    </div>
    <div id="jobs-wrap"></div>
    <h2>Estilos de vídeo que o time produz</h2>
    <div class="quadro"><div class="estilos">${Object.entries(NOMES).map(([k, v]) => `<div class="estilo"><div class="tela">${mock(k)}</div>${v}</div>`).join("")}</div></div>
    <h2>Entregas recentes</h2>
    ${grade(itens.slice(0, 9), "Nenhuma entrega ainda. Escolha o que criar acima.")}`;
  desenharJobs(jobs, 6);
}

function grade(itens, vazio) {
  if (!itens.length) return `<div class="card vazio">${vazio}</div>`;
  const rot = { pesquisas: "Pesquisa", cortes: "Cortes", campanhas: "Estratégia", carrosseis: "Carrossel" };
  return `<div class="grade">${itens.map((i) => `
    <a class="card item" href="#/item/${i.tipo}/${encodeURIComponent(i.id)}">
      <div class="thumb">${i.capa && /\.png$/.test(i.capa) ? `<img src="/${esc(i.capa)}" style="height:100%;aspect-ratio:4/5;object-fit:cover">` : i.capa ? `<video src="/${esc(i.capa)}#t=1" preload="metadata" muted></video>` : (i.formatos.length ? i.formatos.slice(0, 4).map(mock).join("") : `<div class="ico" style="border-color:var(--line)">${ico(i.tipo === "cortes" ? "tesoura" : i.tipo === "pesquisas" ? "busca" : "estrategia")}</div>`)}</div>
      <div><span class="tag acc">${i.origem === "edicao" ? "Vídeo" : rot[i.tipo]}</span></div>
      <h4>${esc(i.titulo)}</h4><p>${esc(i.resumo)}</p>
      <div class="meta">${i.contagem.roteiros ? `<span class="tag">${i.contagem.roteiros} roteiros</span>` : ""}${i.contagem.cortes && i.origem !== "edicao" ? `<span class="tag">${i.contagem.cortes} cortes</span>` : ""}${i.contagem.slides ? `<span class="tag">${i.contagem.slides} slides</span>` : ""}<span class="tag">${data(i.criado_em)}</span></div>
    </a>`).join("")}</div>`;
}

const logsAbertos = new Set();
let filtroJobs = null; // na página de uma entrega, mostra só os jobs ligados a ela
const decorrido = (j) => { const s = Math.round(((j.fim ? new Date(j.fim) : new Date()) - new Date(j.inicio)) / 1000); return s < 60 ? `${s}s` : `${Math.floor(s / 60)}min ${String(s % 60).padStart(2, "0")}s`; };
function desenharJobs(jobs, limite = 10) {
  const wrap = $("#jobs-wrap");
  if (!wrap) return;
  const lista = (filtroJobs ? jobs.filter(filtroJobs) : jobs).slice(0, limite);
  if (!lista.length) { wrap.innerHTML = ""; return; }
  const st = { rodando: "Em produção", concluido: "Pronto", erro: "Falhou" };
  wrap.innerHTML = `<h2>Em produção</h2><div class="jobs">${lista.map((j) => `
    <div class="card job ${j.status}" data-job="${esc(j.id)}">
      <span class="pulso"></span>
      <div><b>${esc(j.titulo || j.prompt)}</b><small>${j.status === "rodando" && j.etapa ? `<b style="display:inline;color:var(--accent);font-weight:600">${esc(j.etapa)}</b> · ` : `${st[j.status] || j.status} · `}${j.motor === "python" ? "ferramenta local" : "time de agentes"} · ${decorrido(j)}</small></div>
      <div class="acoes">${j.entrega && (j.status === "concluido" || j.status === "rodando" || itensCache.some((i) => i.id === j.entrega.id)) ? `<a class="btn-sec" href="#/item/${j.entrega.tipo}/${encodeURIComponent(j.entrega.id)}">Abrir</a>` : ""}<button class="btn-sec" data-log="${esc(j.id)}">${logsAbertos.has(j.id) ? "Ocultar log" : "Log"}</button></div>
      ${logsAbertos.has(j.id) ? `<pre class="log" id="log-${esc(j.id)}">carregando…</pre>` : ""}
    </div>`).join("")}</div>`;
  $$("[data-log]", wrap).forEach((b) => b.onclick = () => { const id = b.dataset.log; logsAbertos.has(id) ? logsAbertos.delete(id) : logsAbertos.add(id); desenharJobs(jobsCache, limite); });
  logsAbertos.forEach(async (id) => { const el = $(`#log-${CSS.escape(id)}`); if (el) { el.textContent = (await api(`/api/jobs/${id}/log`)) || "(sem saída ainda)"; el.scrollTop = 1e9; } });
}

setInterval(async () => {
  if (!$("#jobs-wrap") || document.hidden) return;
  if (!jobsCache.some((j) => j.status === "rodando")) return;
  const antes = jobsCache.map((j) => j.status).join();
  [jobsCache, itensCache] = await Promise.all([api("/api/jobs"), api("/api/itens")]);
  navAtivo(); desenharJobs(jobsCache, location.hash.startsWith("#/criar") ? 3 : 6);
  if (antes !== jobsCache.map((j) => j.status).join()) {
    if (location.hash === "" || location.hash === "#/") inicio();
    else if (location.hash.startsWith("#/item/")) rota(); // terminou algo desta entrega: recarrega para mostrar
  }
}, 4000);

// ---------- Ações de um roteiro (integração entre os fluxos) ----------
async function acaoRoteiro(acao, arquivo, indice, botao) {
  const rotulo = botao.textContent;
  botao.disabled = true; botao.textContent = "Enviando…";
  try {
    const entrada = { arquivo, indice };
    if (acao === "carrossel") { const a = prompt("@ do perfil que aparece nos slides (opcional):", localStorage.getItem("arroba") || ""); if (a === null) { botao.disabled = false; botao.textContent = rotulo; return; } try { localStorage.setItem("arroba", a); } catch {} entrada.arroba = a; }
    await post("/api/jobs", { acao, entrada });
    jobsCache = await api("/api/jobs"); navAtivo();
    botao.textContent = "Na fila ✓";
    if (!$("#jobs-wrap")) $("#main").insertAdjacentHTML("afterbegin", `<div id="jobs-wrap"></div>`);
    desenharJobs(jobsCache, 4);
    $("#jobs-wrap").scrollIntoView({ behavior: "smooth", block: "start" });

function ligarFonte() {
  const drop = $("#drop"), arq = $("#arq");
  if (!drop) return;
  drop.onclick = () => arq.click();
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("sobre"); };
  drop.ondragleave = () => drop.classList.remove("sobre");
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("sobre"); if (e.dataTransfer.files[0]) enviar(e.dataTransfer.files[0]); };
  arq.onchange = () => arq.files[0] && enviar(arq.files[0]);
  function enviar(f) {
    const up = $("#up"); up.hidden = false;
    const x = new XMLHttpRequest();
    x.open("POST", `/api/upload?nome=${encodeURIComponent(f.name)}`);
    x.upload.onprogress = (e) => { if (e.lengthComputable) $("i", up).style.width = (e.loaded / e.total * 100) + "%"; };
    x.onload = () => {
      const r = JSON.parse(x.responseText || "{}");
      if (x.status !== 200) { up.hidden = true; return alert(r.erro || "Falha no envio"); }
      estado.arquivo = r.caminho;
      $("#fonte-box").innerHTML = `<div class="arquivo-ok"><span>🎬 ${esc(f.name)} · ${(f.size / 1e6).toFixed(0)} MB</span><button class="x" id="tirar" title="Remover">×</button></div>`;
      $("#tirar").onclick = () => { estado.arquivo = null; $("#fonte-box").innerHTML = DROP; ligarFonte(); };

        <a href="https://wa.me/?text=${encodeURIComponent(texto)}" target="_blank" rel="noopener">WhatsApp</a>

}
function ligarCopiar() {
  $$("[data-copiar]").forEach((b) => b.onclick = () => { const r = b.textContent; navigator.clipboard.writeText(b.dataset.copiar); b.textContent = "Copiado ✓"; setTimeout(() => b.textContent = r, 1500); });
}

function cardPost(p) {
  const midia = p.video ? `<video src="/${esc(p.video)}" ${p.imagem ? `poster="/${esc(p.imagem)}"` : ""} controls preload="none" playsinline></video>`
    : p.imagem ? `<img src="/${esc(p.imagem)}" loading="lazy" alt="">`
    : p.codigo ? `<iframe src="https://www.instagram.com/p/${esc(p.codigo)}/embed" loading="lazy" scrolling="no" allowtransparency="true"></iframe>`
    : `<div class="sem">sem prévia</div>`;
  return `<div class="card video-card"><div class="vmidia">${midia}${p.outlier_score != null ? `<span class="selo-alta">${String(p.outlier_score).replace(".", ",")}x a média</span>` : ""}</div>
    <div class="vinfo"><a href="${esc(p.url)}" target="_blank" rel="noopener"><b>${esc(p.perfil || "")}</b> ↗</a>
    <div class="meta" style="padding-top:4px">${p.formato ? `<span class="tag acc">${esc(NOMES[p.formato] || p.formato)}</span>` : ""}${p.formato_ig ? `<span class="tag">${esc(p.formato_ig)}</span>` : ""}${p.views ? `<span class="tag">${n(p.views)} views</span>` : ""}<span class="tag">${n(p.likes)} likes</span><span class="tag">${n(p.comentarios)} coment.</span></div>
    ${p.gancho ? `<p class="vgancho">${esc(p.gancho)}</p>` : ""}</div></div>`;
}

async function abrir(tipo, id) {

  const volta = { pesquisas: "lista/pesquisas", cortes: d.origem === "edicao" ? "lista/videos" : "lista/cortes", campanhas: "lista/campanhas", carrosseis: "lista/carrosseis" }[tipo];
  const arquivo = `dados/${tipo}/${id}.json`;
  filtroJobs = (j) => (j.entrega && j.entrega.id === id) || (j.origem && j.origem.arquivo === arquivo);
  const emAndamento = jobsCache.some((j) => j.status === "rodando" && filtroJobs(j));

  if (tipo === "carrosseis") h += `<h2>Slides · ${(d.slides || []).length}</h2><div class="slides">${(d.slides || []).map((s) => `<div class="slide">${s.arquivo ? `<img src="/${esc(s.arquivo)}" alt="${esc(s.titulo)}">` : `<div class="sem">renderizando…</div>`}${s.arquivo ? `<a class="btn-sec" href="/${esc(s.arquivo)}" download>Baixar ${s.n}</a>` : ""}</div>`).join("")}</div>
    ${(d.slides || []).some((s) => s.arquivo) ? `<button class="btn-pri" style="margin-top:16px" id="baixar-todos">Baixar todos os slides</button>` : ""}
    ${d.legenda ? `<h2>Legenda</h2><div class="card"><p style="white-space:pre-wrap;margin:0">${esc(d.legenda)}</p><p style="color:var(--muted);font-size:13px">${esc((d.hashtags || []).join(" "))}</p><button class="btn-sec" data-copiar="${esc(d.legenda + "\n\n" + (d.hashtags || []).join(" "))}">Copiar legenda</button></div>` : ""}
    ${d.origem?.arquivo ? `<p style="margin-top:20px"><a class="tag" href="#/item/${esc(d.origem.arquivo.split("/")[1])}/${esc(d.origem.arquivo.split("/")[2].replace(".json", ""))}">ver roteiro de origem</a></p>` : ""}`;

  const emAlta = (d.posts_referencia || []).slice().sort((a, b) => (b.outlier_score || 0) - (a.outlier_score || 0)).slice(0, 15);
  if (emAlta.length) h += `<h2>O que está dando certo agora · ${emAlta.length}</h2><p class="lead" style="font-size:14px;margin:-6px 0 16px">Posts reais do nicho que mais passaram da média do próprio perfil. Clique para assistir.</p><div class="videos">${emAlta.map(cardPost).join("")}</div>`;
  if ((d.perfis || []).length) h += `<h2>Perfis que mais engajam · ${d.perfis.length}</h2><div class="card" style="overflow:auto"><table class="posts"><tr><th>Perfil</th><th class="num">Seguidores</th><th class="num">Engaj. por post</th><th class="num">Posts/semana</th><th>O que mais publica</th></tr>${d.perfis.map((p) => `<tr><td><a href="https://instagram.com/${esc(p.username)}" target="_blank" rel="noopener">@${esc(p.username)} ↗</a>${p.nome ? `<br><small style="color:var(--muted)">${esc(p.nome)}</small>` : ""}</td><td class="num">${n(p.seguidores)}</td><td class="num"><b>${pct(p.engajamento_mediano)}</b></td><td class="num">${p.posts_por_semana ?? "—"}</td><td>${Object.entries(p.mix_formatos || {}).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<span class="tag">${esc(k)} ${Math.round(v * 100)}%</span>`).join(" ")}</td></tr>`).join("")}</table></div>`;

  if (tipo === "pesquisas") h += `<div class="faixa"><div><b>Transformar em estratégia e roteiros</b><small>O estrategista e o roteirista partem desta pesquisa</small></div><a href="#/criar/estrategia/${encodeURIComponent(d.id)}">Criar estratégia →</a></div>`;

  if ((d.formatos || []).length) h += `<h2>Formatos que estão performando</h2><div class="card formatos">${d.formatos.map((f) => `

      <div class="barra"><i style="width:${((f.participacao || 0) / maxV) * 100}%"></i></div>
      <small>${pct(f.participacao)} dos top posts · ${n(f.views_medias)} views médias · engajamento ${pct(f.engajamento_medio)}</small>

    h += `<div class="card" style="margin-top:14px"><h4 style="margin-top:0">Música ${atual ? `<span class="tag acc">${esc(nomeMusica(atual.arquivo))} · ${Math.round(atual.volume * 100)}%</span>` : `<span class="tag">sem música</span>`}</h4>${musicaCampo(atual?.arquivo)}

  }
  if ((d.cortes || []).length) h += `<h2>${d.origem === "edicao" ? "Vídeo" : `Cortes · ${d.cortes.length}`}</h2><div class="cortes">${d.cortes.map((c) => `<div class="card corte">
    ${c.arquivo ? `<video src="/${esc(c.arquivo)}${c.versao ? `?v=${c.versao}` : ""}" controls preload="metadata"></video>` : `<div class="sem">renderizando…</div>`}
    <div class="meta">${c.nota != null ? `<span class="nota">${c.nota}</span>` : ""}<span class="tag">${esc(c.inicio)} → ${esc(c.fim)}</span>${c.duracao_s ? `<span class="tag">${Math.round(c.duracao_s)}s</span>` : ""}</div>
    <h4>${esc(c.titulo)}</h4>${c.gancho ? `<div style="font-size:13px">“${esc(c.gancho)}”</div>` : ""}<div style="font-size:12.5px;color:var(--muted);margin-top:4px">${esc(c.por_que || "")}</div>
    ${c.mercado?.padrao ? `<div class="mercado-tag"><b>🔥 Em alta${c.mercado.alinhamento != null ? ` · ${c.mercado.alinhamento}/10` : ""}:</b> ${esc(c.mercado.padrao)}${c.mercado.referencia_url ? ` <a href="${esc(c.mercado.referencia_url)}" target="_blank" rel="noopener">ver post ↗</a>` : ""}</div>` : ""}
    ${c.legenda ? `<div class="legenda-ig"><div class="cab-leg"><b>Legenda para o Instagram</b>${c.titulo_capa ? `<span class="tag">capa: ${esc(c.titulo_capa)}</span>` : ""}</div><p>${esc(c.legenda)}</p><p class="hs">${esc((c.hashtags || []).join(" "))}</p></div>` : `<div class="legenda-ig"><small style="color:var(--muted)">Legenda sendo escrita…</small></div>`}
    <div class="acoes-rot">${c.legenda ? `<button class="btn-pri" data-copiar="${esc(c.legenda + "\n\n" + (c.hashtags || []).join(" "))}">Copiar legenda</button>` : ""}${c.arquivo ? `<a class="btn-sec" href="/${esc(c.arquivo)}" download>Baixar vídeo</a>` : ""}</div></div>`).join("")}</div>`;

  if (d.estrategia) { const e = d.estrategia; h += `<h2>Estratégia</h2><div class="card" style="display:grid;gap:8px">${e.objetivo ? `<div><b>Objetivo:</b> ${esc(e.objetivo)}</div>` : ""}${e.publico ? `<div><b>Público:</b> ${esc(e.publico)}</div>` : ""}${e.posicionamento ? `<div><b>Posicionamento:</b> ${esc(e.posicionamento)}</div>` : ""}${(e.pilares || []).length ? `<div class="meta">${e.pilares.map((p) => `<span class="tag acc">${esc(typeof p === "string" ? p : p.nome || p.titulo || JSON.stringify(p))}</span>`).join("")}</div>` : ""}${(e.funil || []).length ? `<div class="meta">${e.funil.map((p) => `<span class="tag">${esc(typeof p === "string" ? p : p.etapa || p.nome || JSON.stringify(p))}</span>`).join("")}</div>` : ""}</div>`; }

  if (tipo === "cortes" && !(d.cortes || []).length && d.status !== "pronto") h += `<div class="card" style="margin-top:26px;display:flex;gap:12px;align-items:center"><span style="width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulso 1.4s infinite;flex:none"></span><div><b>${esc({ baixando: "Baixando o episódio…", transcrevendo: "Transcrevendo o episódio…", escolhendo: "IA escolhendo os momentos que batem com o mercado…", mercado: "Vendo o que está em alta no nicho…" }[d.status] || "Processando…")}</b><br><small style="color:var(--muted)">Os cortes aparecem aqui assim que forem escolhidos e vão ficando prontos um a um.</small></div></div>`;

  if ((d.criativos || []).length) h += `<h2>Criativos</h2><div class="padroes">${d.criativos.map((c) => `<div class="card">${c.arquivo && /\.(png|jpe?g|webp)$/i.test(c.arquivo) ? `<img src="/${esc(c.arquivo)}" style="width:100%;border-radius:10px;margin-bottom:8px">` : ""}<b>${esc(c.nome)}</b> <span class="tag">${esc(c.formato)}</span><p>${esc(c.briefing)}</p></div>`).join("")}</div>`;

  if (d.trafego?.campanhas?.length) h += `<h2>Tráfego</h2><div class="card" style="overflow:auto"><table class="posts"><tr><th>Campanha</th><th>Plataforma</th><th>Objetivo</th><th>Público</th><th class="num">Orçamento</th></tr>${d.trafego.campanhas.map((c) => `<tr><td>${esc(c.nome)}</td><td>${esc(c.plataforma || "—")}</td><td>${esc(c.objetivo)}</td><td>${esc(c.publico)}</td><td class="num">${c.orcamento ?? "—"}</td></tr>`).join("")}</table></div>`;

  if ((d.calendario || []).length) h += `<h2>Calendário</h2><div class="card" style="overflow:auto"><table class="posts">${d.calendario.map((c) => `<tr><td style="white-space:nowrap">${esc(c.data)}${c.hora ? ` ${esc(c.hora)}` : ""}</td><td><span class="tag">${esc(c.canal)}</span></td><td>${esc(c.peca)}</td><td><span class="tag">${esc(c.status)}</span></td></tr>`).join("")}</table></div>`;

  if ((d.posts_referencia || []).length) h += `<h2>Posts de referência</h2><div class="card" style="overflow:auto"><table class="posts"><tr><th>Post</th><th>Formato</th><th>Gancho</th><th class="num">Acima da média</th><th class="num">Views</th><th class="num">Likes</th><th class="num">Coment.</th></tr>${d.posts_referencia.map((p) => `<tr><td><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.perfil || "abrir")} ↗</a></td><td>${p.formato ? `<span class="tag acc">${esc(NOMES[p.formato] || p.formato)}</span>` : ""} ${p.formato_ig ? `<span class="tag">${esc(p.formato_ig)}</span>` : ""}</td><td>${esc(p.gancho)}</td><td class="num">${p.outlier_score != null ? `<b>${String(p.outlier_score).replace(".", ",")}x</b>` : "—"}</td><td class="num">${n(p.views)}</td><td class="num">${n(p.likes)}</td><td class="num">${n(p.comentarios)}</td></tr>`).join("")}</table></div>`;

  $("#main").innerHTML = h;
  ligarAcoes();
  ligarMusica();
  const jobMusica = async (entrada, b) => { b.disabled = true; b.textContent = "Aplicando…"; try { await post("/api/jobs", { acao: "musica", entrada }); jobsCache = await api("/api/jobs"); abrir(tipo, id); } catch (er) { alert(er.message); b.disabled = false; } };
  if ($("#mus-aplicar")) $("#mus-aplicar").onclick = () => { const m = valorMusica(); if (!m.musica) return alert("Escolha ou envie uma música."); jobMusica({ id, ...m }, $("#mus-aplicar")); };
  if ($("#mus-tirar")) $("#mus-tirar").onclick = () => jobMusica({ id, remover: true }, $("#mus-tirar"));
  desenharJobs(jobsCache, 4);
  if ($("#baixar-todos")) $("#baixar-todos").onclick = () => (d.slides || []).filter((s) => s.arquivo).forEach((s, k) => setTimeout(() => { const a = document.createElement("a"); a.href = "/" + s.arquivo; a.download = `${id}-${String(s.n).padStart(2, "0")}.png`; a.click(); }, k * 300));
  if (emAndamento) setTimeout(() => location.hash === `#/item/${tipo}/${encodeURIComponent(id)}` && !$("details[open]") && abrir(tipo, id), 6000);
  if ((d.cortes || []).some((c) => !c.arquivo || (!c.legenda && d.status !== "pronto")) || (d.slides || []).some((s) => !s.arquivo)) setTimeout(() => location.hash === `#/item/${tipo}/${encodeURIComponent(id)}` && abrir(tipo, id), 8000);
}

const iniciais = (s) => String(s || "?").split(/\s+/).filter(Boolean).slice(0, 2).map((x) => x[0]).join("").toUpperCase();
const CORES_PROF = ["#FF6A13", "#007AFF", "#AF52DE", "#34C759", "#FF2D55", "#5856D6", "#FF9500", "#30B0C7"];
const corProf = (id) => CORES_PROF[[...String(id)].reduce((a, c) => a + c.charCodeAt(0), 0) % CORES_PROF.length];

function mdLinha(s) {
  let h = esc(s);
  h = h.replace(/^### (.*)$/, "<h5>$1</h5>").replace(/^## (.*)$/, "<h4>$1</h4>").replace(/^# (.*)$/, "<h4>$1</h4>");
  h = h.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  return h.replace(/^(\s*)[-*] (.*)$/, "$1• $2");
}
function md(s) {
  // tabelas markdown (| a | b |) viram <table>; o resto, linha a linha
  const blocos = []; let tab = [];
  const fechar = () => {
    if (!tab.length) return;
    const rows = tab.filter((l) => !/^\s*\|?\s*:?-{2,}/.test(l)).map((l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim()));
    blocos.push(`<table class="md-tab">${rows.map((r, i) => `<tr>${r.map((c) => (i ? `<td>${mdLinha(c)}</td>` : `<th>${mdLinha(c)}</th>`)).join("")}</tr>`).join("")}</table>`);
    tab = [];
  };
  for (const l of String(s || "").split("\n")) { if (/^\s*\|.*\|\s*$/.test(l)) tab.push(l); else { fechar(); blocos.push(mdLinha(l) + "<br>"); } }
  fechar();
  return blocos.join("").replace(/(<br>)+$/, "");
}

async function enviarChat(pid, profId, txt) {
  const msg = txt.value.trim();
  if (!msg) return;
  const msgs = $("#msgs");
  $(".chat-vazio", msgs)?.remove();
  msgs.insertAdjacentHTML("beforeend", bolha({ papel: "professor", texto: msg }) + `<div class="msg ia"><div class="b" id="resp"><span class="digitando"><i></i><i></i><i></i></span></div></div>`);
  txt.value = ""; txt.style.height = "auto"; $("#env").disabled = true; msgs.scrollTop = 1e9;
  const resp = $("#resp"); let texto = "", mudou = false;
  try {
    const r = await fetch(`/api/perfis/${pid}/professores/${profId}/chat`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mensagem: msg }) });
    const leitor = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
    while (true) {
      const { value, done } = await leitor.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const bloco = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = (bloco.match(/^event: (.*)$/m) || [])[1]; const dados = JSON.parse((bloco.match(/^data: (.*)$/m) || [])[1] || "{}");
        if (ev === "delta") { texto += dados.texto; resp.innerHTML = md(texto); }
        if (ev === "ferramenta") { const a = acaoChat(dados); if (a) { resp.insertAdjacentHTML("beforeend", `<div class="nota-mem">${esc(a)}</div>`); if (!/aprendizado/.test(a)) mudou = true; } }
        msgs.scrollTop = 1e9;
      }
    }
  } catch (e) { resp.innerHTML = `<span class="erro-msg">Falhou: ${esc(e.message)}</span>`; }
  resp.removeAttribute("id"); resp.parentElement.insertAdjacentHTML("beforeend", `<button class="copiar-msg" data-copiar="${esc(texto)}">Copiar</button>`);
  $("#env").disabled = false; ligarCopiar(); txt.focus();
  if (mudou) telaProfessor(pid, profId); // mostra na hora roteiros e vídeos que o chat salvou
}

// ---------- Rotas ----------
async function rota() {
  const partes = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  if (partes[0] !== "item") filtroJobs = null;
  window.scrollTo(0, 0);
  if (partes[0] === "criar") return criar(partes[1], partes[2]);
  if (partes[0] === "lista") return lista(partes[1]);
  if (partes[0] === "item") return abrir(partes[1], partes[2]);
  if (partes[0] === "roteiros") return todosRoteiros(partes[1]);
  if (partes[0] === "time") return time();
  if (partes[0] === "perfis") return telaPerfis();
  if (partes[0] === "perfil") return telaPerfil(partes[1]);
  if (partes[0] === "professor") return telaProfessor(partes[1], partes[2]);
  return inicio();
}
window.addEventListener("hashchange", rota);
api("/api/jobs").then((j) => { jobsCache = j; navAtivo(); });
carregarTime();
rota();
</script>
